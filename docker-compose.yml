services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stratifyai
      POSTGRES_USER: stratify
      POSTGRES_PASSWORD: stratify_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratify -d stratifyai"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - stratifyai-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://stratify:stratify_dev_only@db:5432/stratifyai
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  stratifyai-postgres:
